services:
  mysql:
    image: mysql:8.4
    container_name: lupriv_new_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${DB_NAME:-lupriv_new}
      MYSQL_USER: ${DB_USER:-lupriv}
      MYSQL_PASSWORD: ${DB_PASSWORD:-lupriv_pass}
      TZ: Europe/Sarajevo
    # No host port in default (prod-like). Use docker-compose.dev.yml for 3307.
    volumes:
      - lupriv_new_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-uroot",
          "-p${MYSQL_ROOT_PASSWORD:-rootpass}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    build: ./server
    container_name: lupriv_new_api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3001"
      TZ: Europe/Sarajevo
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: ${DB_USER:-lupriv}
      DB_PASSWORD: ${DB_PASSWORD:-lupriv_pass}
      DB_NAME: ${DB_NAME:-lupriv_new}
      JWT_SECRET: ${JWT_SECRET:-change_me_to_a_long_random_string}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      # Same-origin via web nginx; set public HTTPS origin on VPS
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      KIOSK_ALLOW_BRANCH_QUERY: ${KIOSK_ALLOW_BRANCH_QUERY:-0}
      AUTO_LOGOUT_SECRET: ${AUTO_LOGOUT_SECRET:-change_me_auto_logout_secret}
      # The API refuses to start with the default secrets above (NODE_ENV=production).
      # Local prod-like testing only: ALLOW_INSECURE_DEFAULTS=1 in .env.
      ALLOW_INSECURE_DEFAULTS: ${ALLOW_INSECURE_DEFAULTS:-0}
      # Reverse proxies in front of the API: web nginx = 1; Caddy → web nginx = 2.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      # Voditelji may edit the previous month until this day of the month (0 = no lock).
      HOURS_EDIT_LOCK_DAY: ${HOURS_EDIT_LOCK_DAY:-5}
      # Minutes added to branch kraj_rv when auto-logout closes a forgotten day session (old app: 60).
      AUTO_LOGOUT_EXTRA_MINUTES: ${AUTO_LOGOUT_EXTRA_MINUTES:-0}
    # API not published on host by default (reach via web nginx /api/).
    # Expose 3001 with docker-compose.dev.yml when debugging.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  web:
    build: ./client
    container_name: lupriv_new_web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      # Loopback only: reach it via Caddy (or http://localhost:8080 locally). Exposing 8080
      # publicly would bypass HTTPS and let clients spoof X-Forwarded-For.
      - "${WEB_BIND:-127.0.0.1}:8080:80"
    # On VPS: Caddy/host nginx → this container (or map 80/443 → web).
    # Local/prod-behind-caddy testing: http://localhost:8080

volumes:
  lupriv_new_mysql_data:
